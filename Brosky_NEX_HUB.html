<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Brosky NEX-HUB</title>
<style>
:root{--bg:#0b1220;--panel:#111c2d;--line:#29384c;--txt:#f4f7fb;--muted:#a5b4c8;--orange:#ff781f;--green:#22c55e;--red:#ef4444}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 13px;background:var(--orange);color:#171717;font-weight:750}button.secondary{background:#26364b;color:var(--txt);border:1px solid var(--line)}button.danger{background:#7f1d1d;color:white}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#0b1423;color:var(--txt)}label{display:block;color:var(--muted);font-size:12px;margin:10px 0 5px}header{position:sticky;top:0;z-index:3;background:#0d1727f2;border-bottom:1px solid var(--line);padding:13px;display:flex;gap:10px;align-items:center}.logo{background:var(--orange);border-radius:12px;padding:10px;font-size:22px}.brand{flex:1}.brand strong{font-size:19px}.brand small{display:block;color:var(--muted)}.pill,.tag{font-size:11px;border-radius:999px;background:#163a2b;color:#86efac;padding:5px 8px}main{max-width:950px;margin:auto;padding:14px 14px 100px}.hero,.card,.stat,.product{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px}.hero{background:linear-gradient(135deg,#17263b,#101827);margin-bottom:12px}.hero h1{margin:0 0 5px;font-size:22px}.muted,small{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:12px 0}.stat small{display:block;font-size:12px}.stat b{display:block;font-size:22px;margin-top:4px;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.product{text-align:left;color:var(--txt);min-height:105px}.product strong{display:block;margin:7px 0}.price,.total{color:#fdba74;font-weight:850;font-size:21px}.section{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 9px}.section h2{font-size:18px;margin:0}.row,.between{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.row>*{min-width:0}.stack{display:grid;gap:9px}.fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:9px}.list{padding:11px 0;border-bottom:1px solid var(--line)}.nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;overflow-x:auto;background:#0d1727f7;border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom));gap:3px}.nav button{flex:1;min-width:60px;background:transparent;color:var(--muted);padding:8px 3px;font-size:11px}.nav button.active{background:#3a241a;color:#fdba74}.nav span{display:block;font-size:18px}.notice{padding:10px;border-radius:10px;background:#172438;border:1px solid var(--line);margin:10px 0}.hidden{display:none!important}.inline{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.inline button{padding:8px 10px;font-size:13px}.empty{text-align:center;padding:20px;color:var(--muted)}.modalback{position:fixed;inset:0;z-index:10;background:#000a;display:grid;place-items:end center;padding:10px}.modal{width:min(600px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}.foot{font-size:11px;color:var(--muted);padding:16px 3px}@media(min-width:760px){main{padding:22px 24px 40px}.stats{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(3,1fr)}.nav{position:sticky;top:70px;max-width:900px;margin:auto;border:1px solid var(--line);border-radius:12px}.nav span{display:inline;margin-right:4px}.modalback{place-items:center}}
</style></head><body>
<header><div class="logo">🔥</div><div class="brand"><strong>BROSKY <span style="color:#fdba74">NEX-HUB</span></strong><small>Sistema administrativo</small></div><span id="pill" class="pill">Caja cerrada</span></header>
<main><div id="notice" class="notice hidden"></div><section id="view"></section><div class="foot">Prototipo para practicar. Los datos se guardan en este navegador de este dispositivo. Exporta respaldos; todavía no sincroniza entre teléfonos.</div></main>
<nav class="nav" id="nav"><button data-p="home" class="active"><span>⌂</span>Inicio</button><button data-p="pos"><span>＋</span>Ventas</button><button data-p="products"><span>▦</span>Productos</button><button data-p="inventory"><span>📦</span>Inventario</button><button data-p="expenses"><span>🧾</span>Gastos</button><button data-p="cash"><span>▣</span>Caja</button><button data-p="reports"><span>▤</span>Reportes</button></nav><div id="modal"></div>
<script>
const KEY='brosky_nexhub_v1',base={products:[{id:1,name:'¼ de pollo',price:3.49,cost:1.8,stock:0,initial:0,cat:'Pollos',portion:.25,active:true},{id:2,name:'½ pollo',price:5.49,cost:2.7,stock:0,initial:0,cat:'Pollos',portion:.5,active:true},{id:3,name:'Pollo entero',price:11.49,cost:4.5,stock:0,initial:0,cat:'Pollos',portion:1,active:true},{id:4,name:'Hamburguesa',price:6.5,cost:3.2,stock:0,initial:0,cat:'Comidas',portion:0,active:true},{id:5,name:'Chorizo',price:1.25,cost:.4,stock:0,initial:0,cat:'Comidas',portion:0,active:true},{id:6,name:'Papas',price:2,cost:.5,stock:0,initial:0,cat:'Acompañamientos',portion:0,active:true},{id:7,name:'Patacones',price:2,cost:.6,stock:0,initial:0,cat:'Acompañamientos',portion:0,active:true},{id:8,name:'Batido 16 oz',price:3,cost:1,stock:0,initial:0,cat:'Bebidas',portion:0,active:true},{id:9,name:'Coca-Cola',price:1,cost:.45,stock:0,initial:0,cat:'Bebidas',portion:0,active:true}],sales:[],expenses:[],purchases:[],cash:{opened:false,opening:0,history:[]},nextTicket:1001,inventorySet:false};
let s=load(),page='home',cart=[],editId=null;
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return x?{...structuredClone(base),...x,cash:{...base.cash,...x.cash}}:structuredClone(base)}catch(e){return structuredClone(base)}}
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function $$(n){return '$'+Number(n||0).toFixed(2)}
function prod(id){return s.products.find(p=>p.id===+id)}
function totals(){let sales=s.sales.filter(x=>!x.voided),ts=sales.reduce((a,x)=>a+x.total,0),cs=sales.filter(x=>x.method==='Efectivo').reduce((a,x)=>a+x.total,0),ds=sales.filter(x=>x.method!=='Efectivo').reduce((a,x)=>a+x.total,0),ce=s.expenses.filter(x=>x.method==='Efectivo').reduce((a,x)=>a+x.amount,0),te=s.expenses.reduce((a,x)=>a+x.amount,0),cost=sales.reduce((a,x)=>a+x.items.reduce((b,i)=>b+i.cost*i.qty,0),0);return{sales,ts,cs,ds,ce,te,cost,gross:ts-cost,expected:s.cash.opening+cs-ce}}
function note(t){let n=document.getElementById('notice');n.textContent=t;n.classList.remove('hidden');clearTimeout(window.nt);window.nt=setTimeout(()=>n.classList.add('hidden'),4000)}
function go(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));render()}
document.getElementById('nav').onclick=e=>{let b=e.target.closest('[data-p]');if(b)go(b.dataset.p)};
function render(){document.getElementById('pill').textContent=s.cash.opened?'Caja abierta':'Caja cerrada';let v=document.getElementById('view');v.innerHTML=({home:homeView,pos:posView,products:productsView,inventory:inventoryView,expenses:expensesView,cash:cashView,reports:reportsView})[page]();wire()}
function homeView(){let t=totals();return `<div class="hero"><h1>¡Bienvenido a Brosky! 🔥</h1><div class="muted">Ventas, inventario, gastos y caja en un solo lugar.</div><div class="inline"><button onclick="go('pos')">＋ Nueva venta</button><button class="secondary" onclick="go('cash')">${s.cash.opened?'Ver caja':'Abrir caja'}</button><button class="secondary" onclick="backup()">Exportar respaldo</button></div></div><div class="stats"><div class="stat"><small>Ventas del turno</small><b>${$$(t.ts)}</b></div><div class="stat"><small>Tickets</small><b>${t.sales.length}</b></div><div class="stat"><small>Gastos</small><b>${$$(t.te)}</b></div><div class="stat"><small>Efectivo esperado</small><b>${$$(s.cash.opened?t.expected:0)}</b></div></div><div class="section"><h2>Acciones rápidas</h2><span class="tag">${new Date().toLocaleDateString('es-PA')}</span></div><div class="grid"><button class="product" onclick="go('pos')">🛒<strong>Registrar venta</strong><small>Ticket automático</small></button><button class="product" onclick="go('expenses')">🧾<strong>Registrar gasto</strong><small>Concepto y forma de pago</small></button><button class="product" onclick="go('inventory')">📦<strong>Inventario</strong><small>Entradas y existencias</small></button><button class="product" onclick="go('cash')">💵<strong>Apertura / cierre</strong><small>Cuadre de caja</small></button></div><div class="section"><h2>Últimas ventas</h2><button class="secondary" onclick="go('reports')">Ver tickets</button></div>${t.sales.slice(0,4).map(x=>`<div class="list between"><div><b>Ticket #${x.ticket}</b><div class="muted">${x.date} ${x.time} · ${x.method}</div></div><b>${$$(x.total)}</b></div>`).join('')||'<div class="empty">Todavía no hay ventas.</div>'}`}
function posView(){let active=s.products.filter(p=>p.active);return `<div class="section"><h2>Punto de venta</h2><span class="tag">${s.cash.opened?'Caja abierta':'Caja cerrada'}</span></div>${!s.cash.opened?'<div class="notice">Primero debes abrir caja. <button onclick="go(\\'cash\\')">Abrir caja</button></div>':''}<input id="search" placeholder="Buscar producto..."><div class="grid" id="prodGrid">${active.map(p=>`<button class="product" onclick="addCart(${p.id})" ${!s.cash.opened?'disabled':''}><small>${esc(p.cat)} · stock ${p.portion?Number(p.stock.toFixed(2))+' pollo eq.':p.stock+' ud.'}</small><strong>${esc(p.name)}</strong><span class="price">${$$(p.price)}</span></button>`).join('')}</div><div class="section"><h2>Ticket actual</h2><button class="secondary" onclick="cart=[];render()">Vaciar</button></div><div class="card">${cart.map(i=>`<div class="list"><div class="between"><div><b>${esc(i.name)}</b><div class="muted">${$$(i.price)} c/u</div></div><b>${$$(i.price*i.qty)}</b></div><div class="inline"><button class="secondary" onclick="qty(${i.id},-1)">−</button><span>${i.qty}</span><button class="secondary" onclick="qty(${i.id},1)">+</button><button class="danger" onclick="removeCart(${i.id})">Quitar</button></div></div>`).join('')||'<div class="empty">Toca los productos para agregarlos.</div>'}<div class="section"><h2>Total</h2><div class="total">${$$(cart.reduce((a,i)=>a+i.price*i.qty,0))}</div></div><label>Medio de pago</label><select id="pay"><option>Efectivo</option><option>Yappy</option><option>Tarjeta</option><option>Transferencia</option></select><label>Efectivo recibido (opcional; si paga exacto, dejar vacío)</label><input id="received" type="number" min="0" step=".01" placeholder="Monto recibido"><button style="width:100%;margin-top:12px" onclick="sell()" ${!s.cash.opened||!cart.length?'disabled':''}>✓ Registrar venta y generar ticket</button></div>`}
function addCart(id){let p=prod(id);if(!s.cash.opened){note('Abre caja primero.');go('cash');return}let i=cart.find(x=>x.id===id),q=(i?.qty||0)+1;if(p.portion?q*p.portion>prod(3).stock:q>p.stock){note('Stock insuficiente. Revisa inventario.');return}if(i)i.qty++;else cart.push({...p,qty:1});render()}
function qty(id,d){let i=cart.find(x=>x.id===id);if(!i)return;let q=i.qty+d,p=prod(id);if(q<=0)return removeCart(id);if(p.portion?q*p.portion>prod(3).stock:q>p.stock)return note('La cantidad supera el stock.');i.qty=q;render()}
function removeCart(id){cart=cart.filter(x=>x.id!==id);render()}
function sell(){if(!s.cash.opened)return note('Caja cerrada.');if(!cart.length)return note('Agrega productos.');for(let i of cart){let p=prod(i.id);if(p.portion?i.qty*p.portion>prod(3).stock:i.qty>p.stock)return note('Stock insuficiente: '+i.name)}let method=document.getElementById('pay').value,total=cart.reduce((a,i)=>a+i.price*i.qty,0),received=method==='Efectivo'?(Number(document.getElementById('received').value)||total):total;if(method==='Efectivo'&&received<total)return note('El efectivo recibido no cubre el total.');let items=cart.map(i=>({...i}));items.forEach(i=>{let p=prod(i.id);if(p.portion){prod(3).stock=+(prod(3).stock-i.portion*i.qty).toFixed(3)}else{p.stock=+(p.stock-i.qty).toFixed(3)}});let sale={ticket:s.nextTicket++,date:new Date().toLocaleDateString('es-PA'),time:new Date().toLocaleTimeString('es-PA',{hour:'2-digit',minute:'2-digit'}),items,total,method,received,change:method==='Efectivo'?received-total:0,voided:false};s.sales.unshift(sale);cart=[];save();render();note('Venta registrada · Ticket #'+sale.ticket);ticketModal(sale.ticket)}
function productsView(){return `<div class="section"><h2>Productos y precios</h2><button onclick="productForm()">＋ Agregar</button></div><p class="muted">Edita nombre, precio, costo, categoría y stock. Configura cuartos y medios para descontar fracciones de pollo.</p>${s.products.map(p=>`<div class="list between"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.cat)} · costo ${$$(p.cost)} · stock ${p.stock}</div></div><div style="text-align:right"><b>${$$(p.price)}</b><div><button class="secondary" onclick="productForm(${p.id})">Editar</button></div></div></div>`).join('')}`}
function productForm(id){let p=id?prod(id):{name:'',price:'',cost:'',stock:0,cat:'Comidas',portion:0,active:true};editId=id||null;modal(`<div class="between"><h2>${id?'Editar producto':'Nuevo producto'}</h2><button class="secondary" onclick="closeModal()">✕</button></div><form id="pf"><label>Nombre</label><input name="name" required value="${esc(p.name)}"><div class="fieldrow"><div><label>Precio venta ($)</label><input name="price" type="number" min="0" step=".01" required value="${p.price}"></div><div><label>Costo unitario ($)</label><input name="cost" type="number" min="0" step=".01" required value="${p.cost}"></div></div><div class="fieldrow"><div><label>Categoría</label><select name="cat">${['Pollos','Comidas','Acompañamientos','Bebidas','Otros'].map(x=>`<option ${x===p.cat?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Existencias</label><input name="stock" type="number" min="0" step=".25" required value="${p.stock}"></div></div><label>Cómo descuenta inventario</label><select name="portion"><option value="0" ${!p.portion?'selected':''}>Unidad normal</option><option value=".25" ${p.portion===.25?'selected':''}>¼ pollo (0.25 pollo)</option><option value=".5" ${p.portion===.5?'selected':''}>½ pollo (0.5 pollo)</option><option value="1" ${p.portion===1?'selected':''}>Pollo entero (1 pollo)</option></select><label><input style="width:auto" type="checkbox" name="active" ${p.active?'checked':''}> Activo en ventas</label><button style="width:100%;margin-top:12px">Guardar producto</button></form>`);document.getElementById('pf').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),o={name:f.get('name').trim(),price:+f.get('price'),cost:+f.get('cost'),stock:+f.get('stock'),cat:f.get('cat'),portion:+f.get('portion'),active:f.get('active')==='on'};if(!o.name||o.price<0||o.cost<0||o.stock<0)return note('Revisa los campos');if(id)Object.assign(prod(id),o);else s.products.push({id:Math.max(0,...s.products.map(x=>x.id))+1,initial:o.stock,...o});save();closeModal();render();note('Producto guardado.')}
}
function inventoryView(){let c=prod(3);return `<div class="section"><h2>Inventario inicial</h2><button class="secondary" onclick="setInitial()">Fijar inicial</button></div><div class="card"><b>Pollos enteros como inventario base</b><p class="muted">El stock de pollo se controla como unidades equivalentes. Los cuartos y medios consumen fracciones del mismo inventario, no se suman como existencias extra.</p><label>Pollos enteros disponibles</label><input id="chick" type="number" min="0" step=".25" value="${c.stock}"><button style="width:100%;margin-top:8px" onclick="setChicken()">Guardar stock de pollo</button><div class="stats"><div class="stat"><small>Enteros posibles</small><b>${c.stock}</b></div><div class="stat"><small>Medios posibles</small><b>${c.stock*2}</b></div><div class="stat"><small>Cuartos posibles</small><b>${c.stock*4}</b></div></div></div><div class="section"><h2>Otros productos</h2></div>${s.products.filter(p=>p.id!==3).map(p=>`<div class="list between"><div><b>${esc(p.name)}</b><div class="muted">Inicial ${p.initial} · actual ${p.stock}</div></div><button class="secondary" onclick="adjust(${p.id})">Ajustar</button></div>`).join('')}<div class="section"><h2>Entradas de mercancía</h2><button onclick="purchaseForm()">＋ Compra</button></div>${s.purchases.slice(0,8).map(p=>`<div class="list between"><div><b>${esc(p.name)}</b><div class="muted">${p.date} · ${p.qty} unidades</div></div><b>${$$(p.total)}</b></div>`).join('')||'<div class="empty">Todavía no hay compras.</div>'}`}
function setInitial(){s.products.forEach(p=>p.initial=p.stock);s.inventorySet=true;save();render();note('Inventario inicial guardado.')}
function setChicken(){let v=Number(document.getElementById('chick').value);if(!Number.isFinite(v)||v<0)return note('Cantidad inválida.');prod(3).stock=v;save();render();note('Stock de pollo actualizado.')}
function adjust(id){let p=prod(id);modal(`<h2>Ajustar inventario</h2><p>${esc(p.name)} · actual ${p.stock}</p><label>Nueva cantidad</label><input id="adjustVal" type="number" min="0" step=".25" value="${p.stock}"><label>Motivo</label><input id="adjustReason" placeholder="Compra, merma, conteo..."><div class="inline"><button onclick="saveAdjust(${id})">Guardar</button><button class="secondary" onclick="closeModal()">Cancelar</button></div>`)}
function saveAdjust(id){let v=Number(document.getElementById('adjustVal').value);if(!Number.isFinite(v)||v<0)return note('Cantidad inválida');let p=prod(id),delta=v-p.stock;p.stock=v;s.purchases.unshift({name:'Ajuste: '+p.name,qty:delta,total:0,date:new Date().toLocaleDateString('es-PA'),reason:document.getElementById('adjustReason').value});save();closeModal();render();note('Inventario ajustado.')}
function purchaseForm(){modal(`<h2>Registrar compra</h2><form id="buy"><label>Producto</label><select name="id">${s.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><div class="fieldrow"><div><label>Cantidad recibida</label><input name="qty" type="number" min=".01" step=".25" required></div><div><label>Total pagado ($)</label><input name="total" type="number" min="0" step=".01" required></div></div><label>Proveedor (opcional)</label><input name="supplier"><button style="width:100%;margin-top:12px">Guardar compra</button></form><button class="secondary" style="margin-top:8px" onclick="closeModal()">Cancelar</button>`);document.getElementById('buy').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),p=prod(f.get('id')),q=+f.get('qty'),t=+f.get('total');if(q<=0||t<0)return note('Revisa cantidad y monto');p.stock+=q;s.purchases.unshift({name:p.name,qty:q,total:t,date:new Date().toLocaleDateString('es-PA'),supplier:f.get('supplier')});save();closeModal();render();note('Compra registrada y stock aumentado.')}
}
function expensesView(){return `<div class="section"><h2>Registrar gasto</h2></div><div class="card"><form id="ef"><label>Concepto / qué compraste</label><input name="concept" required placeholder="Papas, gas, envases, luz..."><div class="fieldrow"><div><label>Monto ($)</label><input name="amount" type="number" min=".01" step=".01" required></div><div><label>Categoría</label><select name="cat"><option>Mercancía</option><option>Servicios</option><option>Alquiler</option><option>Transporte</option><option>Mantenimiento</option><option>Otros</option></select></div></div><label>Medio de pago</label><select name="method"><option>Efectivo</option><option>Yappy</option><option>Tarjeta</option><option>Transferencia</option></select><label>Notas</label><input name="notes" placeholder="Proveedor o detalle"><button style="width:100%;margin-top:12px">Guardar gasto</button></form></div><div class="section"><h2>Historial de gastos</h2><b>${$$(totals().te)}</b></div>${s.expenses.map(x=>`<div class="list between"><div><b>${esc(x.concept)}</b><div class="muted">${x.date} ${x.time} · ${esc(x.cat)} · ${esc(x.method)}</div></div><b>${$$(x.amount)}</b></div>`).join('')||'<div class="empty">No hay gastos registrados.</div>'}`}
function wire(){let f=document.getElementById('ef');if(f)f.onsubmit=e=>{e.preventDefault();if(!s.cash.opened){note('Abre caja antes de registrar movimientos del turno.');go('cash');return}let d=new FormData(f),a=+d.get('amount');if(a<=0)return note('Monto inválido');s.expenses.unshift({id:Date.now(),concept:d.get('concept').trim(),amount:a,cat:d.get('cat'),method:d.get('method'),notes:d.get('notes'),date:new Date().toLocaleDateString('es-PA'),time:new Date().toLocaleTimeString('es-PA',{hour:'2-digit',minute:'2-digit'})});save();render();note('Gasto registrado.')};let q=document.getElementById('search');if(q)q.oninput=()=>{let val=q.value.toLowerCase();document.querySelectorAll('#prodGrid .product').forEach(el=>el.classList.toggle('hidden',!el.innerText.toLowerCase().includes(val)))}}
function cashView(){let t=totals();if(!s.cash.opened)return `<div class="section"><h2>Apertura de caja</h2><span class="tag">Antes de vender</span></div><div class="card"><p class="muted">Cuenta el dinero físico al comenzar. No incluyas Yappy ni saldo bancario.</p><label>Fondo inicial de caja ($)</label><input id="opening" type="number" min="0" step=".01" value="${s.cash.opening||''}" placeholder="Ej. 50.00"><label>Responsable (opcional)</label><input id="cashUser" placeholder="Gio o Pao"><button style="width:100%;margin-top:12px" onclick="openCash()">✓ Confirmar apertura</button></div>${s.cash.history.map(h=>`<div class="list between"><div><b>Cierre ${h.date}</b><div class="muted">Diferencia ${$$(h.diff)}</div></div><b>${$$(h.expected)}</b></div>`).join('')}`;
return `<div class="section"><h2>Caja abierta</h2><span class="pill">Turno activo</span></div><div class="stats"><div class="stat"><small>Fondo inicial</small><b>${$$(s.cash.opening)}</b></div><div class="stat"><small>Ventas en efectivo</small><b>${$$(t.cs)}</b></div><div class="stat"><small>Gastos efectivo</small><b>${$$(t.ce)}</b></div><div class="stat"><small>Efectivo esperado</small><b>${$$(t.expected)}</b></div></div><div class="card"><div class="section"><h2>Cierre de caja</h2></div><p class="muted">Cuenta el efectivo físico y compara con el esperado.</p><label>Efectivo contado ($)</label><input id="actual" type="number" min="0" step=".01" placeholder="Monto contado"><label>Observaciones</label><textarea id="closeNotes" rows="3" placeholder="Faltante, sobrante, retiro..."></textarea><div class="inline"><button onclick="closeCash()">Realizar cierre</button><button class="secondary" onclick="exportClose()">Copiar resumen</button></div></div><div class="card" style="margin-top:10px"><div class="list between"><span>Ventas totales</span><b>${$$(t.ts)}</b></div><div class="list between"><span>Ventas digitales</span><b>${$$(t.ds)}</b></div><div class="list between"><span>Gastos totales</span><b>${$$(t.te)}</b></div></div>`}
function openCash(){let v=Number(document.getElementById('opening').value);if(!Number.isFinite(v)||v<0)return note('Fondo inicial inválido');s.cash.opened=true;s.cash.opening=v;s.cash.openedAt=new Date().toISOString();s.cash.user=document.getElementById('cashUser').value;s.cash.actual=null;save();render();note('Caja abierta con '+$$(v)+'.')}
function closeCash(){let el=document.getElementById('actual'),v=Number(el.value);if(el.value===''||!Number.isFinite(v)||v<0)return note('Introduce el efectivo contado');let t=totals(),h={date:new Date().toLocaleString('es-PA'),opening:s.cash.opening,sales:t.ts,expenses:t.te,expected:t.expected,actual:v,diff:v-t.expected,notes:document.getElementById('closeNotes').value};s.cash.history.unshift(h);s.cash.opened=false;s.cash.actual=v;s.cash.closedAt=new Date().toISOString();save();render();note('Cierre realizado. Diferencia: '+$$(h.diff));modal(`<h2>Resumen de cierre</h2><p class="muted">${esc(h.date)}</p>${[['Fondo inicial',h.opening],['Ventas',h.sales],['Gastos',h.expenses],['Efectivo esperado',h.expected],['Efectivo contado',h.actual],['Diferencia',h.diff]].map(a=>`<div class="list between"><span>${a[0]}</span><b>${$$(a[1])}</b></div>`).join('')}<p>${esc(h.notes||'Sin observaciones')}</p><button style="width:100%" onclick="copyClose()">Copiar informe</button><button class="secondary" style="width:100%;margin-top:8px" onclick="closeModal()">Cerrar</button>`)}
function copyClose(){let h=s.cash.history[0];if(h)copy(`CIERRE BROSKY ${h.date}\nFondo inicial: ${$$(h.opening)}\nVentas: ${$$(h.sales)}\nGastos: ${$$(h.expenses)}\nEsperado: ${$$(h.expected)}\nContado: ${$$(h.actual)}\nDiferencia: ${$$(h.diff)}\n${h.notes||''}`)}
function exportClose(){let t=totals();copy(`RESUMEN BROSKY\nFondo inicial ${$$(s.cash.opening)}\nVentas efectivo ${$$(t.cs)}\nVentas digitales ${$$(t.ds)}\nGastos efectivo ${$$(t.ce)}\nGastos totales ${$$(t.te)}\nEfectivo esperado ${$$(t.expected)}`)}
function reportsView(){let t=totals();return `<div class="section"><h2>Reportes y tickets</h2><button class="secondary" onclick="backup()">Respaldo</button></div><div class="stats"><div class="stat"><small>Ventas</small><b>${$$(t.ts)}</b></div><div class="stat"><small>Gastos</small><b>${$$(t.te)}</b></div><div class="stat"><small>Costo de productos vendidos</small><b>${$$(t.cost)}</b></div><div class="stat"><small>Ganancia bruta estimada</small><b>${$$(t.gross)}</b></div></div><div class="card"><p class="muted">Ventas menos gastos no equivale necesariamente a utilidad neta. La ganancia bruta depende de que los costos unitarios estén completos y actualizados.</p><div class="list between"><span>Ventas efectivo</span><b>${$$(t.cs)}</b></div><div class="list between"><span>Ventas digitales</span><b>${$$(t.ds)}</b></div><div class="list between"><span>Ventas menos gastos</span><b>${$$(t.ts-t.te)}</b></div></div><div class="section"><h2>Historial de tickets (${t.sales.length})</h2></div>${t.sales.map(x=>`<div class="list"><div class="between"><div><b>Ticket #${x.ticket}</b><div class="muted">${x.date} ${x.time} · ${x.method}</div><small>${x.items.map(i=>`${i.qty} × ${esc(i.name)}`).join(', ')}</small></div><b>${$$(x.total)}</b></div><div class="inline"><button class="secondary" onclick="ticketModal(${x.ticket})">Ver / copiar</button><button class="danger" onclick="voidSale(${x.ticket})">Anular</button></div></div>`).join('')||'<div class="empty">Todavía no hay tickets.</div>'}<div class="section"><h2>Respaldo de datos</h2></div><div class="card"><p class="muted">Descarga el archivo JSON para guardar una copia. Restaurar reemplaza los datos actuales.</p><div class="inline"><button onclick="backup()">Descargar copia</button><button class="secondary" onclick="document.getElementById('restore').click()">Restaurar copia</button><input class="hidden" id="restore" type="file" accept=".json,application/json"></div><button class="danger" style="width:100%;margin-top:12px" onclick="reset()">Borrar datos de prueba</button></div>`}
function ticketModal(id){let x=s.sales.find(a=>a.ticket===id);if(!x)return;modal(`<div class="between"><h2>Ticket #${x.ticket}</h2><button class="secondary" onclick="closeModal()">Cerrar</button></div><p class="muted">Brosky · ${x.date} · ${x.time}</p><hr style="border-color:var(--line)">${x.items.map(i=>`<div class="list between"><span>${i.qty} × ${esc(i.name)}</span><b>${$$(i.qty*i.price)}</b></div>`).join('')}<div class="section"><h2>TOTAL</h2><div class="total">${$$(x.total)}</div></div><p class="muted">Pago: ${x.method}${x.method==='Efectivo'?`<br>Recibido ${$$(x.received)} · Cambio ${$$(x.change)}`:''}</p><button style="width:100%" onclick="copyTicket(${x.ticket})">Copiar ticket</button>`)}
function copyTicket(id){let x=s.sales.find(a=>a.ticket===id);if(x)copy(`BROSKY TICKET #${x.ticket}\n${x.date} ${x.time}\n${x.items.map(i=>`${i.qty} x ${i.name} ${$$(i.qty*i.price)}`).join('\n')}\nTOTAL ${$$(x.total)}\nPago ${x.method}${x.method==='Efectivo'?`\nRecibido ${$$(x.received)}\nCambio ${$$(x.change)}`:''}`)}
function voidSale(id){if(!confirm('¿Anular ticket #'+id+' y devolver productos al inventario?'))return;let x=s.sales.find(a=>a.ticket===id);if(!x||x.voided)return;x.voided=true;x.items.forEach(i=>{let p=prod(i.id);if(p)if(p.portion)prod(3).stock+=i.portion*i.qty;else p.stock+=i.qty});save();render();note('Ticket anulado y stock devuelto.')}
function copy(text){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>note('Copiado al portapapeles.')).catch(()=>fallback(text));else fallback(text)}
function fallback(text){let el=document.createElement('textarea');el.value=text;document.body.appendChild(el);el.select();try{document.execCommand('copy');note('Copiado.')}catch(e){modal(`<textarea rows="8">${esc(text)}</textarea>`)}el.remove()}
function backup(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.href=u;a.download='Brosky_NEX-HUB_respaldo.json';a.click();URL.revokeObjectURL(u);note('Respaldo descargado.')}
function reset(){if(!confirm('¿Borrar todos los productos editados, tickets, gastos y datos de caja de este navegador?'))return;s=structuredClone(base);cart=[];save();render();note('Datos reiniciados.')}
function modal(content){document.getElementById('modal').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal">${content}</div></div>`}
function closeModal(){document.getElementById('modal').innerHTML=''}
document.addEventListener('change',e=>{if(e.target.id==='restore'&&e.target.files[0]){let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.products||!x.sales||!x.cash)throw 0;if(confirm('Restaurar reemplaza los datos actuales. ¿Continuar?')){s={...structuredClone(base),...x,cash:{...base.cash,...x.cash}};save();render();note('Copia restaurada.')}}catch(_){note('Archivo de respaldo inválido.')}};r.readAsText(e.target.files[0])}});
render();
</script></body></html>
