<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17251f">
<title>Nexo Gestión — Prototipo</title>
<style>
:root{--ink:#17251f;--muted:#68756e;--bg:#f4f6f3;--card:#fff;--line:#e1e7e2;--accent:#f3ad43;--green:#24764d;--red:#b34242;--shadow:0 8px 26px #14261a0b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}.side{background:var(--ink);color:white;padding:22px 15px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:11px;padding:0 8px}.logo{background:var(--accent);color:var(--ink);font-weight:900;border-radius:12px;width:40px;height:40px;display:grid;place-items:center}.brand strong{display:block;font-size:19px;letter-spacing:-.5px}.brand small{color:#b8c7bd}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c6d0c9;text-align:left;padding:12px;border-radius:10px;display:flex;gap:11px;align-items:center}.nav button.active,.nav button:hover{background:#2c3b33;color:white}.nav .ico{width:22px;text-align:center}.side-note{margin-top:auto;color:#b8c7bd;font-size:12px;line-height:1.5;padding:10px}.main{min-width:0}.top{background:#fff;border-bottom:1px solid var(--line);padding:17px 28px;display:flex;justify-content:space-between;align-items:center;gap:16px}.top h1{font-size:20px;margin:0}.top p{margin:4px 0 0;color:var(--muted);font-size:13px}.top-actions{display:flex;gap:8px;align-items:center}.content{padding:26px;max-width:1450px;margin:auto}.pill{background:#fff4dc;color:#85560e;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700}.btn{border:1px solid var(--line);background:white;border-radius:10px;padding:10px 13px;color:var(--ink);font-weight:650}.btn.primary{background:var(--ink);border-color:var(--ink);color:white}.btn.accent{background:var(--accent);border-color:var(--accent)}.btn.danger{color:var(--red)}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--shadow);min-width:0}.stat-label{color:var(--muted);font-size:13px}.stat-value{font-size:27px;font-weight:780;letter-spacing:-1px;margin:9px 0 4px}.stat-foot{font-size:12px;color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:23px 0 12px}.section-head h2{font-size:17px;margin:0}.two{grid-template-columns:1.2fr .8fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.muted{color:var(--muted)}.small{font-size:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:650;background:#fbfcfb}td strong{font-weight:700}.table-actions{display:flex;gap:6px}.empty{padding:28px;text-align:center;color:var(--muted)}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;padding:10px 11px;border:1px solid #d9e1db;border-radius:9px;background:white;color:var(--ink);min-width:0}.field textarea{min-height:80px;resize:vertical}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.toolbar input{max-width:230px}.toolbar select{max-width:220px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.callout{padding:13px 14px;border-radius:11px;background:#fff4dc;color:#77500e;font-size:13px;line-height:1.5}.good{color:var(--green)}.bad{color:var(--red)}.tag{font-size:11px;border-radius:999px;padding:5px 8px;background:#edf2ee;color:#405448}.tag.low{background:#ffebeb;color:#9b3333}.mobile-nav{display:none}.bar{height:8px;border-radius:20px;background:#e8eee9;overflow:hidden}.bar span{display:block;height:100%;background:var(--green)}.product-list{display:grid;gap:10px}.product-row{display:grid;grid-template-columns:minmax(0,1.4fr) .7fr .7fr .7fr;gap:9px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.product-row:last-child{border-bottom:0}.product-row input{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;min-width:0}.hidden{display:none!important}.footer{color:var(--muted);font-size:11px;text-align:center;padding:24px 0 4px}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.three{grid-template-columns:1fr 1fr}.content{padding:20px}}
@media(max-width:700px){.shell{display:block;padding-bottom:70px}.side{display:none}.top{padding:14px 16px}.top h1{font-size:18px}.top-actions .pill{display:none}.content{padding:15px}.stats{gap:9px}.card{padding:14px}.stat-value{font-size:23px}.form-grid{grid-template-columns:1fr 1fr}.three{grid-template-columns:1fr}.mobile-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:10;padding:5px 3px env(safe-area-inset-bottom)}.mobile-nav button{border:0;background:transparent;padding:7px 1px;color:var(--muted);font-size:10px;display:grid;justify-items:center;gap:3px}.mobile-nav button.active{color:var(--green);font-weight:800}.mobile-nav span:first-child{font-size:17px}.product-row{grid-template-columns:1.2fr .7fr .7fr}.product-row .hide-mobile{display:none}.top-actions .btn{padding:8px}.section-head{align-items:flex-start;flex-direction:column}.form-grid .wide{grid-column:1/-1}}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
 <div class="brand"><div class="logo">N</div><div><strong>Nexo Gestión</strong><small>Tu negocio, bajo control</small></div></div>
 <div class="nav" id="sideNav"></div>
 <div class="side-note">Prototipo inicial · Datos guardados en este navegador.<br>Versión de demostración, no producción.</div>
</aside>
<main class="main">
 <header class="top"><div><h1 id="pageTitle">Resumen</h1><p id="businessSubtitle">Panel de control de tu negocio</p></div><div class="top-actions"><span class="pill">DEMO LOCAL</span><button class="btn" id="exportBtn">Exportar datos</button></div></header>
 <div class="content" id="view"></div>
</main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>
<script>
const NAV=[
 ['dashboard','▦','Resumen'],['sales','↗','Ventas'],['inventory','▤','Inventario'],['purchases','＋','Compras'],['expenses','↘','Gastos y pagos'],['close','▣','Cierre de caja'],['settings','⚙','Configuración']
];
const defaults={
 business:{name:'Mi negocio',type:'restaurant',currency:'USD',openingCash:100},
 products:[
  {id:1,name:'Cuarto de pollo',category:'Comida',price:3.49,cost:1.50,stock:20,active:true,recipe:[{ingredient:'Pollo',qty:.25},{ingredient:'Papas',qty:1}]},
  {id:2,name:'Medio pollo',category:'Comida',price:5.49,cost:2.63,stock:10,active:true,recipe:[{ingredient:'Pollo',qty:.5},{ingredient:'Papas',qty:1}]},
  {id:3,name:'Pollo entero',category:'Comida',price:11.49,cost:5.25,stock:10,active:true,recipe:[{ingredient:'Pollo',qty:1},{ingredient:'Papas',qty:2}]},
  {id:4,name:'Hamburguesa',category:'Comida',price:6.50,cost:3.50,stock:12,active:true,recipe:[{ingredient:'Pan',qty:1},{ingredient:'Carne',qty:1},{ingredient:'Queso',qty:1}]}
 ],
 ingredients:[
  {id:1,name:'Pollo',unit:'pollo entero equivalente',cost:4.50,stock:10},
  {id:2,name:'Papas',unit:'porción',cost:.375,stock:24},
  {id:3,name:'Pan',unit:'unidad',cost:.4167,stock:12},
  {id:4,name:'Carne',unit:'unidad',cost:1.9993,stock:15},
  {id:5,name:'Queso',unit:'rebanada',cost:.1458,stock:48}
 ],
 sales:[],purchases:[],expenses:[],cashMoves:[],closedDays:[]
};
let state=load();let current='dashboard';let nextId=1;
function load(){try{const x=JSON.parse(localStorage.getItem('nexo-demo-v1'));return x?{...structuredClone(defaults),...x}:structuredClone(defaults)}catch{return structuredClone(defaults)}}
function save(){localStorage.setItem('nexo-demo-v1',JSON.stringify(state))}
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:state.business.currency||'USD'}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const sum=(arr,fn)=>arr.reduce((a,x)=>a+fn(x),0);
function daySales(){return state.sales.filter(x=>x.date===today())}
function dayPurchases(){return state.purchases.filter(x=>x.date===today())}
function dayExpenses(){return state.expenses.filter(x=>x.date===today())}
function salesTotal(arr=daySales()){return sum(arr,x=>x.price*x.qty)}
function cogs(arr=daySales()){return sum(arr,x=>x.cost*x.qty)}
function expenseTotal(arr=dayExpenses()){return sum(arr,x=>x.amount)}
function purchaseTotal(arr=dayPurchases()){return sum(arr,x=>x.total)}
function cashPayments(){return sum(daySales().filter(x=>x.payment==='Efectivo'),x=>x.price*x.qty)-sum(daySales().filter(x=>x.payment==='Efectivo'),x=>x.change||0)}
function expectedCash(){const opening=Number(state.business.openingCash)||0;const cashSales=sum(daySales().filter(x=>x.payment==='Efectivo'),x=>x.price*x.qty);const cashPurchases=sum(dayPurchases().filter(x=>x.payment==='Efectivo'),x=>x.total);const cashExpenses=sum(dayExpenses().filter(x=>x.payment==='Efectivo'),x=>x.amount);const otherIn=sum(state.cashMoves.filter(x=>x.date===today()&&x.kind==='in'),x=>x.amount);const otherOut=sum(state.cashMoves.filter(x=>x.date===today()&&x.kind==='out'),x=>x.amount);return opening+cashSales-cashPurchases-cashExpenses+otherIn-otherOut}
function grossProfit(){return salesTotal()-cogs()}
function netEstimate(){return grossProfit()-expenseTotal()}
function nav(){const mk=(where)=>NAV.map(([id,ico,label])=>`<button data-nav="${id}" class="${current===id?'active':''}"><span class="ico">${ico}</span><span>${label}</span></button>`).join('');document.getElementById('sideNav').innerHTML=mk();document.getElementById('mobileNav').innerHTML=NAV.filter(x=>['dashboard','sales','inventory','close','settings'].includes(x[0])).map(([id,ico,label])=>`<button data-nav="${id}" class="${current===id?'active':''}"><span>${ico}</span><span>${label}</span></button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav))}
function go(id){current=id;render()}
function title(){const n=NAV.find(x=>x[0]===current);document.getElementById('pageTitle').textContent=n?n[2]:'Resumen';document.getElementById('businessSubtitle').textContent=state.business.name+' · '+new Date().toLocaleDateString('es-PA',{weekday:'long',day:'numeric',month:'long'})}
function card(label,value,foot=''){return `<div class="card"><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div></div>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">Todavía no hay registros.</td></tr>`}</tbody></table></div>`}
function dashboard(){const low=state.ingredients.filter(i=>i.stock<=5);const recent=[...daySales()].slice(-6).reverse().map(s=>`<tr><td>${esc(s.product)}</td><td>${s.qty}</td><td>${money(s.price*s.qty)}</td><td>${esc(s.payment)}</td><td>${new Date(s.createdAt).toLocaleTimeString('es-PA',{hour:'2-digit',minute:'2-digit'})}</td></tr>`).join('');return `
<div class="grid stats">${card('Ventas de hoy',money(salesTotal()),daySales().length+' registros')}${card('Utilidad bruta estimada',money(grossProfit()),'Ventas menos costo estimado vendido')}${card('Gastos de hoy',money(expenseTotal()),'Gastos registrados')}${card('Efectivo esperado',money(expectedCash()),'Antes del conteo físico')}</div>
<div class="grid two"><section class="card"><div class="section-head" style="margin-top:0"><h2>Ventas recientes</h2><button class="btn" onclick="go('sales')">Registrar venta</button></div>${table(['Producto','Cant.','Total','Pago','Hora'],recent)}</section>
<section class="card"><div class="section-head" style="margin-top:0"><h2>Alertas de inventario</h2><button class="btn" onclick="go('inventory')">Ver inventario</button></div>${low.length?low.map(i=>`<p><span class="tag low">Stock bajo</span> <strong>${esc(i.name)}</strong><br><span class="muted small">${i.stock} ${esc(i.unit)} disponibles</span></p>`).join(''):'<p class="good">No hay alertas de stock mínimo (umbral de demo: 5).</p>'}<hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><p class="muted small">La utilidad neta aquí es estimada. Para resultados contables completos habrá que configurar recetas, compras de inventario, pagos y costos fijos.</p></section></div>
<div class="section-head"><h2>Accesos rápidos</h2></div><div class="toolbar"><button class="btn primary" onclick="go('sales')">＋ Registrar venta</button><button class="btn" onclick="go('purchases')">＋ Registrar compra</button><button class="btn" onclick="go('expenses')">＋ Registrar gasto</button><button class="btn" onclick="go('close')">Ver cierre de caja</button></div>`}
function sales(){const rows=daySales().slice().reverse().map(s=>`<tr><td>${esc(s.product)}</td><td>${s.qty}</td><td>${money(s.price)}</td><td>${money(s.price*s.qty)}</td><td>${esc(s.payment)}</td><td><button class="btn danger" onclick="deleteRecord('sales',${s.id})">Eliminar</button></td></tr>`).join('');return `
<div class="card"><div class="section-head" style="margin-top:0"><h2>Registrar venta</h2><span class="tag">${today()}</span></div><form id="saleForm"><div class="form-grid"><div class="field wide"><label>Producto o servicio</label><select name="product" id="saleProduct" required>${state.products.filter(p=>p.active).map(p=>`<option value="${p.id}">${esc(p.name)} · ${money(p.price)}</option>`).join('')}</select></div><div class="field"><label>Cantidad</label><input name="qty" type="number" min=".01" step=".01" value="1" required></div><div class="field"><label>Precio unitario</label><input name="price" id="salePrice" type="number" min="0" step=".01" required></div><div class="field"><label>Forma de pago</label><select name="payment"><option>Efectivo</option><option>Yappy</option><option>Tarjeta</option><option>Transferencia</option><option>Otro</option></select></div></div><div class="actions"><button class="btn primary">Guardar venta</button></div></form></div>
<div class="section-head"><h2>Ventas de hoy</h2><span class="tag">${daySales().length} operaciones</span></div><div class="card">${table(['Producto','Cant.','Precio','Total','Pago','Acción'],rows)}</div>`}
function inventory(){const rows=state.ingredients.map(i=>`<tr><td><strong>${esc(i.name)}</strong></td><td>${esc(i.unit)}</td><td>${money(i.cost)}</td><td>${i.stock}</td><td>${i.stock<=5?'<span class="tag low">Reponer</span>':'<span class="tag">Disponible</span>'}</td><td><button class="btn" onclick="editIngredient(${i.id})">Editar</button></td></tr>`).join('');const prows=state.products.map(p=>`<tr><td><strong>${esc(p.name)}</strong></td><td>${money(p.price)}</td><td>${money(p.cost)}</td><td>${p.stock}</td><td>${(p.recipe||[]).map(r=>esc(r.ingredient)+' × '+r.qty).join(', ')||'Sin receta'}</td><td><button class="btn" onclick="editProduct(${p.id})">Editar</button></td></tr>`).join('');return `
<div class="callout">Los ingredientes compartidos se configuran una sola vez y pueden asignarse a varias recetas. En esta versión inicial las recetas son visibles, pero el descuento automático de cada ingrediente al vender requiere validar las unidades y recetas antes de activarlo.</div>
<div class="section-head"><h2>Materias primas e ingredientes</h2><button class="btn primary" onclick="showIngredientForm()">＋ Añadir ingrediente</button></div><div class="card">${table(['Ingrediente','Unidad','Costo unitario','Existencia','Estado','Acción'],rows)}</div>
<div class="section-head"><h2>Productos y recetas</h2><button class="btn primary" onclick="showProductForm()">＋ Añadir producto</button></div><div class="card">${table(['Producto','Precio','Costo unitario','Stock','Receta / bases compartidas','Acción'],prows)}</div>
<div id="inventoryForm" class="card hidden"></div>`}
function purchases(){const rows=state.purchases.filter(x=>x.date===today()).slice().reverse().map(p=>`<tr><td>${esc(p.item)}</td><td>${p.qty}</td><td>${money(p.unitCost)}</td><td>${money(p.total)}</td><td>${esc(p.payment)}</td><td><button class="btn danger" onclick="deleteRecord('purchases',${p.id})">Eliminar</button></td></tr>`).join('');return `
<div class="card"><div class="section-head" style="margin-top:0"><h2>Registrar compra</h2></div><form id="purchaseForm"><div class="form-grid"><div class="field"><label>Artículo / insumo</label><input name="item" required placeholder="Ej. Bolsa de papas"></div><div class="field"><label>Cantidad</label><input name="qty" type="number" min=".01" step=".01" value="1" required></div><div class="field"><label>Costo por unidad ($)</label><input name="unitCost" type="number" min="0" step=".01" required></div><div class="field"><label>Pago</label><select name="payment"><option>Efectivo</option><option>Yappy</option><option>Tarjeta</option><option>Crédito / pendiente</option></select></div><div class="field"><label>Proveedor (opcional)</label><input name="supplier" placeholder="Nombre del proveedor"></div></div><div class="actions"><button class="btn primary">Guardar compra</button></div></form></div>
<div class="section-head"><h2>Compras de hoy</h2></div><div class="card">${table(['Artículo','Cantidad','Costo unit.','Total','Pago','Acción'],rows)}<div class="section-head"><strong>Total de compras: ${money(purchaseTotal())}</strong></div></div>`}
function expenses(){const rows=dayExpenses().slice().reverse().map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.category)}</td><td>${money(e.amount)}</td><td>${esc(e.payment)}</td><td><button class="btn danger" onclick="deleteRecord('expenses',${e.id})">Eliminar</button></td></tr>`).join('');const moves=state.cashMoves.filter(x=>x.date===today()).slice().reverse().map(e=>`<tr><td>${e.kind==='in'?'Entrada adicional':'Retiro de caja'}</td><td>${esc(e.description)}</td><td>${money(e.amount)}</td><td><button class="btn danger" onclick="deleteRecord('cashMoves',${e.id})">Eliminar</button></td></tr>`).join('');return `
<div class="grid two"><div class="card"><div class="section-head" style="margin-top:0"><h2>Registrar gasto o pago</h2></div><form id="expenseForm"><div class="form-grid"><div class="field wide"><label>Concepto</label><input name="name" required placeholder="Ej. Gas, transporte, alquiler"></div><div class="field"><label>Categoría</label><select name="category"><option>Operativo</option><option>Servicio</option><option>Alquiler</option><option>Nómina / comisión</option><option>Deuda</option><option>Mantenimiento</option><option>Otro</option></select></div><div class="field"><label>Importe ($)</label><input name="amount" type="number" min=".01" step=".01" required></div><div class="field"><label>Forma de pago</label><select name="payment"><option>Efectivo</option><option>Yappy</option><option>Tarjeta</option><option>Transferencia</option><option>Pendiente</option></select></div></div><div class="actions"><button class="btn primary">Guardar gasto</button></div></form></div>
<div class="card"><div class="section-head" style="margin-top:0"><h2>Movimiento de caja</h2></div><form id="moveForm"><div class="field"><label>Tipo</label><select name="kind"><option value="out">Retiro de caja</option><option value="in">Entrada adicional</option></select></div><div class="field"><label>Concepto</label><input name="description" required placeholder="Ej. Dinero retirado por dueño"></div><div class="field"><label>Importe ($)</label><input name="amount" type="number" min=".01" step=".01" required></div><div class="actions"><button class="btn">Guardar movimiento</button></div></form></div></div>
<div class="section-head"><h2>Gastos de hoy</h2></div><div class="card">${table(['Concepto','Categoría','Importe','Pago','Acción'],rows)}<div class="section-head"><strong>Total gastos: ${money(expenseTotal())}</strong></div></div>
<div class="section-head"><h2>Entradas y retiros de caja</h2></div><div class="card">${table(['Tipo','Concepto','Importe','Acción'],moves)}</div>`}
function closePage(){const cashExpectedNow=expectedCash();const gross=grossProfit();const net=netEstimate();return `
<div class="grid stats">${card('Caja inicial',money(state.business.openingCash),'Configurada en ajustes')}${card('Ventas totales',money(salesTotal()),daySales().length+' operaciones')}${card('Efectivo esperado',money(cashExpectedNow),'Efectivo, compras y pagos en efectivo')}${card('Utilidad operativa estimada',money(net),'Utilidad bruta menos gastos registrados')}</div>
<div class="grid two"><div class="card"><div class="section-head" style="margin-top:0"><h2>Resumen del día</h2></div>${table(['Concepto','Importe'],[
`<tr><td>Ventas registradas</td><td>${money(salesTotal())}</td></tr>`,
`<tr><td>Costo de productos vendidos (estimado)</td><td>− ${money(cogs())}</td></tr>`,
`<tr><td><strong>Utilidad bruta estimada</strong></td><td><strong>${money(gross)}</strong></td></tr>`,
`<tr><td>Gastos registrados</td><td>− ${money(expenseTotal())}</td></tr>`,
`<tr><td><strong>Resultado operativo estimado</strong></td><td><strong>${money(net)}</strong></td></tr>`,
`<tr><td>Compras del día (flujo de caja)</td><td>${money(purchaseTotal())}</td></tr>`])}</div>
<div class="card"><div class="section-head" style="margin-top:0"><h2>Conteo físico de caja</h2></div><div class="field"><label>Efectivo contado ($)</label><input id="countedCash" type="number" min="0" step=".01" placeholder="Cuenta el efectivo real"></div><div id="difference" class="callout" style="margin-top:12px">Introduce el efectivo contado para calcular la diferencia.</div><div class="field" style="margin-top:12px"><label>Nota de cierre</label><textarea id="closeNote" placeholder="Observaciones, incidencias, responsable..."></textarea></div><div class="actions"><button class="btn primary" onclick="closeDay()">Guardar cierre de hoy</button><button class="btn" onclick="print()">Imprimir</button></div></div></div>
<div class="section-head"><h2>Cierres guardados</h2></div><div class="card">${table(['Fecha','Ventas','Efectivo esperado','Efectivo contado','Diferencia','Nota'],state.closedDays.slice().reverse().map(d=>`<tr><td>${d.date}</td><td>${money(d.sales)}</td><td>${money(d.expected)}</td><td>${money(d.counted)}</td><td class="${Math.abs(d.difference)>.009?'bad':'good'}">${money(d.difference)}</td><td>${esc(d.note||'')}</td></tr>`).join(''))}</div>
<div class="callout" style="margin-top:14px">Importante: compras, gastos y utilidad son conceptos diferentes. El resultado es una estimación de gestión, no una declaración fiscal ni contabilidad certificada.</div>`}
function settings(){return `
<div class="grid two"><div class="card"><div class="section-head" style="margin-top:0"><h2>Perfil del negocio</h2></div><form id="settingsForm"><div class="field"><label>Nombre comercial</label><input name="name" value="${esc(state.business.name)}" required></div><div class="field" style="margin-top:12px"><label>Tipo de negocio</label><select name="type"><option value="restaurant" ${state.business.type==='restaurant'?'selected':''}>Restaurante / asadero</option><option value="barber" ${state.business.type==='barber'?'selected':''}>Barbería</option><option value="bakery" ${state.business.type==='bakery'?'selected':''}>Panadería</option><option value="retail" ${state.business.type==='retail'?'selected':''}>Tienda / comercio</option><option value="other" ${state.business.type==='other'?'selected':''}>Otro servicio o negocio</option></select></div><div class="field" style="margin-top:12px"><label>Moneda</label><select name="currency"><option value="USD" ${state.business.currency==='USD'?'selected':''}>USD — dólar estadounidense</option><option value="PAB" ${state.business.currency==='PAB'?'selected':''}>PAB — balboa panameño</option><option value="COP" ${state.business.currency==='COP'?'selected':''}>COP — peso colombiano</option></select></div><div class="field" style="margin-top:12px"><label>Caja inicial predeterminada ($)</label><input name="openingCash" type="number" min="0" step=".01" value="${state.business.openingCash}"></div><div class="actions"><button class="btn primary">Guardar configuración</button></div></form></div>
<div class="card"><div class="section-head" style="margin-top:0"><h2>Datos y seguridad</h2></div><p class="muted small">Esta demo guarda datos en el almacenamiento local del navegador de este dispositivo. No sincroniza entre dispositivos ni crea cuentas de clientes.</p><div class="actions"><button class="btn" onclick="exportData()">Descargar copia JSON</button><label class="btn">Importar copia JSON<input type="file" id="importFile" accept="application/json" hidden></label></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="callout">Antes de vender el sistema hay que implementar autenticación, base de datos en la nube, aislamiento de datos por negocio, permisos, copias de seguridad, pruebas y gestión de suscripciones.</div><div class="actions"><button class="btn danger" onclick="resetDemo()">Restablecer demo</button></div></div></div>
<div class="section-head"><h2>Productos configurados</h2><button class="btn" onclick="go('inventory')">Administrar productos</button></div>
<div class="card"><p>Productos: <strong>${state.products.length}</strong> · Ingredientes: <strong>${state.ingredients.length}</strong> · Ventas registradas: <strong>${state.sales.length}</strong> · Compras registradas: <strong>${state.purchases.length}</strong></p><p class="muted small">Al cambiar el tipo de negocio, configura manualmente productos y servicios adecuados. Los ejemplos de pollo son datos de demostración.</p></div>`}
function render(){save();nav();title();const fn={dashboard,sales,inventory,purchases,expenses,close:closePage,settings};document.getElementById('view').innerHTML=fn[current]();wire();if(current==='sales')syncSalePrice();if(current==='close'){const c=document.getElementById('countedCash');if(c)c.addEventListener('input',()=>{const d=Number(c.value)-expectedCash();document.getElementById('difference').innerHTML='Diferencia: <strong class="'+(Math.abs(d)<.01?'good':d<0?'bad':'')+'">'+money(d)+'</strong> '+(Math.abs(d)<.01?'Caja cuadrada':d<0?'Falta efectivo':'Sobra efectivo')})}}
function wire(){
 const sf=document.getElementById('saleForm');if(sf){sf.onsubmit=e=>{e.preventDefault();const f=new FormData(sf),p=state.products.find(x=>x.id===Number(f.get('product')));if(!p)return;const qty=Number(f.get('qty')),price=Number(f.get('price'));state.sales.push({id:Date.now(),date:today(),product:p.name,productId:p.id,qty,price,cost:p.cost,payment:f.get('payment'),createdAt:new Date().toISOString()});p.stock=Math.max(0,p.stock-qty);(p.recipe||[]).forEach(r=>{const ing=state.ingredients.find(i=>i.name.toLowerCase()===r.ingredient.toLowerCase());if(ing)ing.stock=Math.max(0,ing.stock-r.qty*qty)});render()};document.getElementById('saleProduct').onchange=syncSalePrice}
 const pf=document.getElementById('purchaseForm');if(pf)pf.onsubmit=e=>{e.preventDefault();const f=new FormData(pf),qty=Number(f.get('qty')),unitCost=Number(f.get('unitCost'));const item=f.get('item').trim();state.purchases.push({id:Date.now(),date:today(),item,qty,unitCost,total:qty*unitCost,payment:f.get('payment'),supplier:f.get('supplier')});const ing=state.ingredients.find(i=>i.name.toLowerCase()===item.toLowerCase());if(ing)ing.stock+=qty;render()};
 const ef=document.getElementById('expenseForm');if(ef)ef.onsubmit=e=>{e.preventDefault();const f=new FormData(ef);state.expenses.push({id:Date.now(),date:today(),name:f.get('name'),category:f.get('category'),amount:Number(f.get('amount')),payment:f.get('payment')});render()};
 const mf=document.getElementById('moveForm');if(mf)mf.onsubmit=e=>{e.preventDefault();const f=new FormData(mf);state.cashMoves.push({id:Date.now(),date:today(),kind:f.get('kind'),description:f.get('description'),amount:Number(f.get('amount'))});render()};
 const setf=document.getElementById('settingsForm');if(setf)setf.onsubmit=e=>{e.preventDefault();const f=new FormData(setf);state.business={name:f.get('name').trim(),type:f.get('type'),currency:f.get('currency'),openingCash:Number(f.get('openingCash'))};render()};
 const imp=document.getElementById('importFile');if(imp)imp.onchange=async()=>{try{const f=imp.files[0];if(!f)return;const parsed=JSON.parse(await f.text());if(!parsed.business||!Array.isArray(parsed.products))throw Error('Archivo no válido');state={...structuredClone(defaults),...parsed};save();render();alert('Datos importados.')}catch(err){alert('No se pudo importar el archivo.')}};
}
function syncSalePrice(){const sel=document.getElementById('saleProduct'),price=document.getElementById('salePrice');if(!sel||!price)return;const p=state.products.find(x=>x.id===Number(sel.value));if(p)price.value=p.price}
function deleteRecord(collection,id){if(!confirm('¿Eliminar este registro? Esta acción no se puede deshacer.'))return;state[collection]=state[collection].filter(x=>x.id!==id);render()}
function showIngredientForm(){const el=document.getElementById('inventoryForm');el.classList.remove('hidden');el.innerHTML=`<h2>Añadir ingrediente</h2><form id="newIng"><div class="form-grid"><div class="field"><label>Nombre</label><input name="name" required></div><div class="field"><label>Unidad</label><input name="unit" required placeholder="kg, unidad, porción"></div><div class="field"><label>Costo por unidad</label><input name="cost" type="number" min="0" step=".0001" required></div><div class="field"><label>Existencia inicial</label><input name="stock" type="number" min="0" step=".01" required></div></div><div class="actions"><button class="btn primary">Guardar</button><button type="button" class="btn" onclick="document.getElementById('inventoryForm').classList.add('hidden')">Cancelar</button></div></form>`;document.getElementById('newIng').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.ingredients.push({id:Date.now(),name:f.get('name'),unit:f.get('unit'),cost:Number(f.get('cost')),stock:Number(f.get('stock'))});render()};el.scrollIntoView({behavior:'smooth'})}
function editIngredient(id){const i=state.ingredients.find(x=>x.id===id);if(!i)return;const name=prompt('Nombre del ingrediente',i.name);if(name===null)return;const unit=prompt('Unidad de medida',i.unit);if(unit===null)return;const cost=prompt('Costo unitario',i.cost);if(cost===null)return;const stock=prompt('Existencia actual',i.stock);if(stock===null)return;Object.assign(i,{name:name.trim()||i.name,unit:unit.trim()||i.unit,cost:Number(cost)||0,stock:Number(stock)||0});render()}
function showProductForm(){const el=document.getElementById('inventoryForm');el.classList.remove('hidden');el.innerHTML=`<h2>Añadir producto o servicio</h2><form id="newProd"><div class="form-grid"><div class="field"><label>Nombre</label><input name="name" required></div><div class="field"><label>Categoría</label><input name="category" value="General"></div><div class="field"><label>Precio</label><input name="price" type="number" min="0" step=".01" required></div><div class="field"><label>Costo unitario estimado</label><input name="cost" type="number" min="0" step=".01" required></div><div class="field"><label>Stock inicial</label><input name="stock" type="number" min="0" step=".01" value="0"></div></div><div class="actions"><button class="btn primary">Guardar producto</button><button type="button" class="btn" onclick="document.getElementById('inventoryForm').classList.add('hidden')">Cancelar</button></div></form>`;document.getElementById('newProd').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.products.push({id:Date.now(),name:f.get('name'),category:f.get('category'),price:Number(f.get('price')),cost:Number(f.get('cost')),stock:Number(f.get('stock')),active:true,recipe:[]});render()};el.scrollIntoView({behavior:'smooth'})}
function editProduct(id){const p=state.products.find(x=>x.id===id);if(!p)return;const name=prompt('Nombre del producto',p.name);if(name===null)return;const price=prompt('Precio de venta',p.price);if(price===null)return;const cost=prompt('Costo unitario estimado',p.cost);if(cost===null)return;const stock=prompt('Stock de producto terminado',p.stock);if(stock===null)return;Object.assign(p,{name:name.trim()||p.name,price:Number(price)||0,cost:Number(cost)||0,stock:Number(stock)||0});render()}
function closeDay(){const field=document.getElementById('countedCash');if(!field||field.value===''){alert('Introduce el efectivo contado antes de guardar el cierre.');return}const counted=Number(field.value),expected=expectedCash();const note=document.getElementById('closeNote').value;const record={date:today(),sales:salesTotal(),expected,counted,difference:counted-expected,note,expenses:expenseTotal(),gross:grossProfit(),net:netEstimate()};const idx=state.closedDays.findIndex(x=>x.date===today());if(idx>=0){if(!confirm('Ya existe un cierre de hoy. ¿Quieres reemplazarlo?'))return;state.closedDays[idx]=record}else state.closedDays.push(record);save();alert('Cierre guardado en este navegador.');render()}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nexo-gestion-copia-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
function resetDemo(){if(!confirm('Esto borra los datos de esta demo en este navegador. ¿Continuar?'))return;state=structuredClone(defaults);save();render()}
document.getElementById('exportBtn').onclick=exportData;
render();
</script>
</body></html>
